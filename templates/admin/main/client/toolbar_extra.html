{% load i18n %}
<div class="mb-4">
    <button type="button" onclick="document.getElementById('quick-add-client-modal').classList.remove('hidden')"
            class="flex items-center gap-2 bg-primary-600 text-white font-medium px-4 py-2 rounded-default text-sm hover:bg-primary-700 transition-colors">
        <span class="material-symbols-outlined text-[18px]" aria-hidden="true">person_add</span>
        {% trans "Mijoz qo'shish" %}
    </button>
</div>

<div id="quick-add-client-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
    <div class="bg-white dark:bg-base-900 rounded-default shadow-xl w-full max-w-md p-6 border border-base-200 dark:border-base-800">
        <div class="flex items-center justify-between mb-4">
            <h2 class="font-semibold text-lg text-font-important-light dark:text-font-important-dark">{% trans "Mijoz qo'shish" %}</h2>
            <button type="button" onclick="document.getElementById('quick-add-client-modal').classList.add('hidden')"
                    class="text-base-500 hover:text-base-700 dark:hover:text-base-300">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
            </button>
        </div>
        <form method="post" action="{% url 'admin:main_client_add_quick' %}" class="flex flex-col gap-4">
            {% csrf_token %}
            <div class="flex flex-col gap-1">
                <label class="text-sm font-medium text-font-important-light dark:text-font-important-dark">{% trans "Mijoz ismi" %}</label>
                <input type="text" name="client_name" required
                       class="border border-base-200 rounded-default px-3 py-2 text-sm focus:border-primary-600 focus:ring focus:ring-primary-600/20 dark:bg-base-800 dark:border-base-700 dark:text-base-200">
            </div>
            <div class="flex flex-col gap-1">
                <label class="text-sm font-medium text-font-important-light dark:text-font-important-dark">{% trans "Telefon raqami" %}</label>
                <input type="text" name="client_phone" required
                       class="border border-base-200 rounded-default px-3 py-2 text-sm focus:border-primary-600 focus:ring focus:ring-primary-600/20 dark:bg-base-800 dark:border-base-700 dark:text-base-200">
            </div>
            <button type="submit"
                    class="flex items-center justify-center gap-2 bg-primary-600 text-white font-medium px-4 py-2.5 rounded-default text-sm hover:bg-primary-700 transition-colors mt-2">
                <span class="material-symbols-outlined text-[18px]" aria-hidden="true">save</span>
                {% trans "Saqlash" %}
            </button>
        </form>
    </div>
</div>
